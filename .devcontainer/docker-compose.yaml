services:
  rustfs:
    image: rustfs/rustfs:1.0.1
    expose:
      - "9000"
      - "9001"
    environment:
      RUSTFS_ACCESS_KEY: "${AWS_ACCESS_KEY_ID:-rustfsadmin}"
      RUSTFS_SECRET_KEY: "${AWS_SECRET_ACCESS_KEY:-rustfsadmin}"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/workspace:cached,z
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      MIX_ENV: "dev"
      DB_HOST: "db"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-rustfsadmin}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-rustfsadmin}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-typster-assets}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://rustfs:9000}"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: typster_dev
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  rustfs_data:
