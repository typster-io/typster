name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "lib/**"
      - "test/**"
      - "config/**"
      - "priv/**"
      - "assets/**"
      - "mix.exs"
      - "mix.lock"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "config/**"
      - "priv/**"
      - "assets/**"
      - "mix.exs"
      - "mix.lock"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

env:
  MIX_ENV: test
  # The Pixi/conda toolchain reports an `x86_64-conda-linux-gnu` target, which
  # has no precompiled y_ex (Yjs) NIF — build it from Rust source instead (the
  # `rust` Pixi dep + the optional `rustler` dep make this work).
  RUSTLER_PRECOMPILED_FORCE_BUILD_ALL: "true"

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true
          pixi-version: v0.68.0

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ hashFiles('pixi.lock', '**/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-

      - name: Install deps
        run: pixi run mix deps.get

      - name: Compile (warnings as errors)
        run: pixi run mix compile --warnings-as-errors

      - name: Check formatting
        run: pixi run mix format --check-formatted

      - name: Credo
        run: pixi run mix credo

  tests:
    name: Elixir tests (${{ matrix.edition }})
    runs-on: ubuntu-latest

    # Run the suite twice: the open-core build (no `vendor/pro`) and the Pro
    # build (the private modules mounted in), so a change can't pass community
    # while silently breaking the paid paths — or vice versa.
    strategy:
      fail-fast: false
      matrix:
        edition: [community, pro]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # The Pro edition needs the private `typster-pro` repo. Without a token
      # (forks, Dependabot) it can't be fetched, so that matrix leg no-ops with a
      # warning rather than failing — the community leg always runs.
      - name: Resolve Pro edition access
        id: edition
        env:
          PRO_TOKEN: ${{ secrets.PRO_REPO_TOKEN }}
        run: |
          if [ "${{ matrix.edition }}" = "pro" ] && [ -z "$PRO_TOKEN" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pro edition skipped::Set the PRO_REPO_TOKEN secret to run the Pro-edition test leg."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.edition.outputs.run == 'true'

      # Mount the closed-source Pro modules so `Typster.Pro.*` compiles in and the
      # `:pro`-tagged suite exercises the paid paths. `PRO_REF` (a repo variable)
      # can target a matching Pro feature branch; it defaults to `main`.
      - name: Mount Pro modules
        if: matrix.edition == 'pro' && steps.edition.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          repository: typster-io/typster-pro
          ref: ${{ vars.PRO_REF || 'main' }}
          token: ${{ secrets.PRO_REPO_TOKEN }}
          path: vendor/pro

      - uses: prefix-dev/setup-pixi@v0.9.6
        if: steps.edition.outputs.run == 'true'
        with:
          cache: true

      - name: Cache deps
        if: steps.edition.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ matrix.edition }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.edition }}-

      - name: Cache build
        if: steps.edition.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ matrix.edition }}-${{ hashFiles('pixi.lock', '**/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-${{ matrix.edition }}-

      - name: Install deps
        if: steps.edition.outputs.run == 'true'
        run: pixi run mix deps.get

      - name: Compile (warnings as errors)
        if: steps.edition.outputs.run == 'true'
        run: pixi run mix compile --warnings-as-errors

      # The fork tests copy real objects, so the suite needs an S3 endpoint.
      # Service containers can't pass a command, and minio/minio needs
      # `server /data`, so start it as a plain container on the defaults the
      # test config already assumes (minioadmin / localhost:9000).
      - name: Start MinIO
        if: steps.edition.outputs.run == 'true'
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -fs http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become healthy" >&2
          docker logs minio >&2
          exit 1

      - name: Run tests
        if: steps.edition.outputs.run == 'true'
        run: |
          if [ "${{ matrix.edition }}" = "pro" ]; then
            pixi run mix test --include pro
          else
            pixi run mix test
          fi

  browser:
    name: Browser tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ hashFiles('pixi.lock', '**/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('assets/bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-

      # mix deps.get must run before bun install: assets/package.json declares
      # `"workspaces": ["../deps/*"]` and pulls phoenix / phoenix_html /
      # phoenix_live_view via `workspace:*`. Without populated `deps/` the
      # workspace resolution diverges from bun.lock and `--frozen-lockfile`
      # fails with "lockfile had changes".
      - name: Install deps
        run: pixi run mix deps.get

      - name: Install Bun deps
        working-directory: assets
        run: pixi run bun install --frozen-lockfile

      - name: Build assets
        run: pixi run mix assets.build

      - name: Setup database
        run: pixi run mix do ecto.create --quiet, ecto.migrate --quiet

      - name: Install Playwright browser
        working-directory: assets
        run: pixi run bun run playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: assets
        run: pixi run bun run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: assets/playwright-report/
          if-no-files-found: ignore
